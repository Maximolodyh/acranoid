# WebSocket на том же порту, что и сайт (80/443).
# Установка:
#   sudo cp deploy/apache-arkanoid-ws.conf /etc/apache2/conf-available/arkanoid-ws.conf
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo a2enconf arkanoid-ws
#   sudo systemctl reload apache2
#
# Клиент подключается к ws(s)://<ваш-домен>/ws
# Node слушает только 127.0.0.1:3001 (не открывайте 3001 в firewall).

ProxyPreserveHost On

<Location "/ws">
    ProxyPass "ws://127.0.0.1:3001/"
    ProxyPassReverse "ws://127.0.0.1:3001/"
</Location>
